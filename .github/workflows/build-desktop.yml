name: build-desktop

# Wails v2 desktop matrix: macOS (Apple Silicon + Intel) + Windows + Linux.
# Mac and Windows cross-build from any host, but Wails refuses macOS->Linux
# cross-compilation (it needs native GTK/WebKit2GTK linking) — so the Linux
# bundle, which cannot be produced on Edvin's Mac, is built here on a real Linux
# runner. That is the whole reason this workflow exists. The Go backend is
# already platform-clean (pure-Go modernc.org/sqlite, no cgo, no _darwin.go in
# the default path), proven by `GOOS=linux/windows ... go build ./...`.
#
# Builds the DEFAULT app (build:tags "fts5") — i.e. the deterministic stub
# transcriber that wails.json ships. The real whisper.cpp engine (-tags whisper)
# links per-platform native static libs + frameworks and is a separate effort;
# it is intentionally NOT built here.
#
# Runs on tag push or manual dispatch; binaries uploaded as artifacts.
# TODO (Edvin): Apple notarization + Windows Authenticode secrets for signed
# distribution once a release channel exists.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            platform: darwin/arm64
          - os: macos-13        # Intel
            platform: darwin/amd64
          - os: windows-latest
            platform: windows/amd64
          - os: ubuntu-22.04    # 22.04 still ships webkit2gtk-4.0 (Wails v2 dep)
            platform: linux/amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Linux build deps (GTK + WebKit2GTK for Wails)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Build (${{ matrix.platform }})
        run: wails build -platform ${{ matrix.platform }} -tags fts5 -clean
      - uses: actions/upload-artifact@v4
        with:
          name: scribe-${{ matrix.os }}
          path: build/bin/**/*
          if-no-files-found: error
